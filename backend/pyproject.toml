[project]
name = "ghgtracker-backend"
version = "0.1.0"
description = "Backend for the Twitch Minecraft coordinate tracker"
readme = "README.md"
authors = [
    { name = "Leon Gött", email = "leon.goett@web.de" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic-settings>=2.16.0",
    "sqlmodel>=0.0.48",
    "streamlink>=8.6.2",
]

[project.scripts]
ghgtracker = "ghgtracker:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ghgtracker"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.File", "fastapi.Depends"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
